name: CIMA Fase III - Despliegue manual autorizado
on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'Escribe APROBADO para autorizar el redeploy de FaseII en Render'
        type: string
        required: true
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    if: ${{ inputs.confirmacion == 'APROBADO' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validar antes del despliegue
        working-directory: FaseIII
        run: |
          python -m unittest discover -s tests -v
          python -m src.pipeline --repo-root .. --out evidencias/pipeline
  desplegar:
    needs: validar
    runs-on: ubuntu-24.04
    environment: cima-academico-render
    steps:
      - name: Solicitar redeploy a Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK" || { echo 'Configure RENDER_DEPLOY_HOOK'; exit 1; }
          curl --fail --silent --show-error --retry 2 --max-time 30 -X POST "$RENDER_DEPLOY_HOOK"
          echo 'Solicitud de despliegue enviada; comprobar el estado en Render.'
