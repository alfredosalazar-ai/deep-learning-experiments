
name: CIMA - Validacion de dataset y resultados

on:
  push:
    branches: [main]
    paths:
      - "cima-nlp-huggingface/**"
      - ".github/workflows/cima-validation.yml"
  pull_request:
    paths:
      - "cima-nlp-huggingface/**"
      - ".github/workflows/cima-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-cima:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias para validacion
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.1,<3" "scikit-learn>=1.4,<2"

      - name: Validar dataset sintetico
        run: |
          python cima-nlp-huggingface/src/validar_dataset.py

      - name: Verificar metricas experimentales
        run: |
          python cima-nlp-huggingface/src/evaluation.py
