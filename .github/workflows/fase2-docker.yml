name: Fase II - prueba y construcción Docker

on:
  push:
    paths:
      - 'FaseII/**'
      - '.github/workflows/fase2-docker.yml'
  pull_request:
    paths:
      - 'FaseII/**'
      - '.github/workflows/fase2-docker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: FaseII
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: FaseII/requirements.txt

      - name: Instalar dependencias de prueba
        run: python -m pip install -r requirements.txt

      - name: Ejecutar pruebas de API y modelo
        run: pytest -q

      - name: Construir imagen Docker
        run: docker build --tag cima-fase2:${{ github.sha }} .

      - name: Probar contenedor construido
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name cima-fase2-test --publish 8000:8000 cima-fase2:${{ github.sha }}
          cleanup() { docker logs cima-fase2-test || true; docker stop cima-fase2-test || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"; then
              break
            fi
            sleep 2
          done
          python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5) as response:
              data = json.load(response)
          assert data['status'] == 'ok' and data['model_loaded'] is True, data
          req = urllib.request.Request(
              'http://127.0.0.1:8000/predict',
              data=json.dumps({'texto':'Solicito confirmar el pago asociado al folio 12345.'}).encode(),
              headers={'Content-Type':'application/json'}, method='POST'
          )
          with urllib.request.urlopen(req, timeout=10) as response:
              result = json.load(response)
          assert result['clase_predicha'] in {'INDIVIDUAL','PAQUETE','AMBIGUA','FUERA_ALCANCE'}
          assert result['decision_operativa'] in {'APTO_PARA_FLUJO_INDIVIDUAL','REVISION_HUMANA'}
          print('Health y predicción Docker: OK')
          PY
