name: CIMA Actividad 8 - Pruebas de observabilidad (offline)
on:
  workflow_dispatch:
  push:
    paths:
      - 'Actividad8/**'
      - '.github/workflows/actividad8-observabilidad.yml'
jobs:
  test-observability:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Actividad8
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
      - name: Simular incidentes fuera de linea
        run: |
          python -m src.incidentes
          python -m src.pipeline --simulado
      - name: Conservar evidencias de laboratorio
        uses: actions/upload-artifact@v4
        with:
          name: cima-a8-simulacion
          path: |
            Actividad8/results/incidentes/*.json
            Actividad8/results/dashboards/dashboard_simulado.html
          retention-days: 14
