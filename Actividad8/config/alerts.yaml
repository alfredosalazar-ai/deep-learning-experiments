version: 1
ambiente: academico_sintetico
service_url: https://chatbot-cima-fase2.onrender.com
# Objetivos de aprendizaje, no SLO de produccion.
slo:
  disponibilidad_min: 0.99
  error_http_5xx_max: 0.01
  latencia_p95_ms_max: 3000
  falsas_elegibilidades_max: 0
  drift_psi_warning: 0.10
  drift_psi_critical: 0.25
alertas:
  cooldown_minutos: 30
  muestras_minimas_disponibilidad: 10
  muestras_minimas_drift: 30
  # Las mediciones al despertar Render Free se marcan warmup y no se incluyen
  # en el SLO de latencia de instancia activa.
  excluir_warmup_latencia: true
  escalar_humano: true
simulacion:
  tiempo_respuesta_esperado_segundos: 300
